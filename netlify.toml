[build]
  command = "npm run build"

# Node.js version — Next.js 16 requires >= 18.18
# Set in Netlify UI: Site > Site settings > Build & deploy > Environment > Node.js version
# Or use environment variable: AWS_LAMBDA_JS_RUNTIME = nodejs20.x

# Next.js is auto-detected by Netlify from package.json
# No publish directory needed — managed by Next.js Runtime

[build.environment]
  NEXT_PUBLIC_APP_URL = "https://your-site.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
